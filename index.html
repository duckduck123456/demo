<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 瀏覽模擬</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ccc;
      font-family: sans-serif;
    }

    .pdf-viewer {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 10px;
      background-color: #f2f2f2;
    }

    .slide {
      width: 100%;
      margin-bottom: 30px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 600px) {
      .pdf-viewer {
        padding: 20px 5px;
      }

      .slide {
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="pdf-viewer">
    <!-- 投影片圖片 -->
    <!-- 以下程式碼會自動顯示 1.jpg 到 17.jpg -->
    <!-- 你也可以手動調整順序或添加標題 -->

    <!-- 你也可以用 JavaScript 自動產生這些 img，但純 HTML 是最穩的 -->

    <img src="image/1.jpg" alt="Slide 1" class="slide">
    <img src="image/2.jpg" alt="Slide 2" class="slide">
    <img src="image/3.jpg" alt="Slide 3" class="slide">
    <img src="image/4.jpg" alt="Slide 4" class="slide">
    <img src="image/5.jpg" alt="Slide 5" class="slide">
    <img src="image/6.jpg" alt="Slide 6" class="slide">
    <img src="image/7.jpg" alt="Slide 7" class="slide">
    <img src="image/8.jpg" alt="Slide 8" class="slide">
    <img src="image/9.jpg" alt="Slide 9" class="slide">
    <img src="image/10.jpg" alt="Slide 10" class="slide">
    <img src="image/11.jpg" alt="Slide 11" class="slide">
    <img src="image/12.jpg" alt="Slide 12" class="slide">
    <img src="image/13.jpg" alt="Slide 13" class="slide">
    <img src="image/14.jpg" alt="Slide 14" class="slide">
    <img src="image/15.jpg" alt="Slide 15" class="slide">
    <img src="image/16.jpg" alt="Slide 16" class="slide">
    <img src="image/17.jpg" alt="Slide 17" class="slide">
  </div>
</body>
</html>
